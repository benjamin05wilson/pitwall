[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "A race-strategy engine: physics-calibrated tyre/pace models, a Monte-Carlo race simulator, strategy optimisation under uncertainty, a learned surrogate for real-time what-ifs, and live in-race Bayesian updating."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Wilson" }]
keywords = ["formula1", "motorsport", "race-strategy", "simulation", "optimization", "machine-learning"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8"]
ml = ["torch>=2.0", "scikit-learn>=1.3"]
data = ["fastf1>=3.0"]
app = ["streamlit>=1.30", "plotly>=5.18"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=7.4", "httpx>=0.27", "build>=1.2"]
all = [
    "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27",
    "torch>=2.0", "scikit-learn>=1.3", "fastf1>=3.0",
    "streamlit>=1.30", "plotly>=5.18", "pytest>=7.4", "numba>=0.58",
]

[project.scripts]
pitwall = "pitwall.cli:main"
pitwall-serve = "pitwall.server:main"

# The package is pure-Python and installs without Rust. The Rust extension is an
# OPTIONAL accelerator built separately (`cd rust && maturin build --release &&
# pip install rust/target/wheels/*.whl`); the simulator falls back to pure Python
# when the compiled module is absent (see pitwall/sim/native.py).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
"pitwall.data" = ["calibrated/*.json"]
